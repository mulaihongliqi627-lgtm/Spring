    name: easy-chat2excel
  servlet:
    multipart:
      max-file-size: 100MB # 上传文件大小上限
      max-request-size: 100MB
  ai:
    dashscope:
      api-key: sk-ws-H.EDDHPRR.H3Ng.MEYCIQCftqD-Dap-_TQHcbmlZWlFRwrK0yMqJ8uevsSjVRtTrgIhAKAkbI4EAlZ7kqzGoOWbjwW9BaybuXvjL7BZpFPtpGxI # 使用个人的秘钥Key
